# SPDX-License-Identifier: Apache-2.0
# Format, lints and tests on the three systems aib-skipstop is to work on. The toolchain is the
# one rust-toolchain.toml pins; rustup installs it on the first cargo call.
name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: toolchain (pinned by rust-toolchain.toml)
        shell: bash
        run: |
          rustup show active-toolchain || rustup toolchain install
          cargo --version
      # the end-to-end test of real mode drives cargo-nextest (without it the test fails, on purpose)
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: format
        if: runner.os == 'Linux'
        shell: bash
        run: cargo fmt --all -- --check
      - name: clippy
        shell: bash
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: test
        shell: bash
        run: cargo test --workspace --locked
      # Every knife's anchor is in its file exactly once (cheap, on every system); the knives
      # themselves run on Linux: each takes one rule away and its own test has to fail.
      - name: knife anchors
        shell: bash
        run: cargo run -q --release --locked -p skipstop-knife -- check
      - name: knives
        if: runner.os == 'Linux'
        shell: bash
        run: ./target/release/skipstop-knife run

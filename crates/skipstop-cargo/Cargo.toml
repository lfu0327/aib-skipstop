[package]
name = "skipstop-cargo"
description = "The cargo adapter and command line of aib-skipstop: cargo-nextest as the runner, its test list and JUnit result read into skipstop-core outcomes."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
repository.workspace = true

[dependencies]
skipstop-core = { path = "../skipstop-core" }
sha2 = "0.10.9"
skipstop-audit = { path = "../skipstop-audit" }
skipstop-ledger = { path = "../skipstop-ledger" }
skipstop-stop = { path = "../skipstop-stop" }
serde_json = "1"

[dev-dependencies]
serde_json = "1"

[[bin]]
name = "aib-skipstop"
path = "src/main.rs"

[lints]
workspace = true
